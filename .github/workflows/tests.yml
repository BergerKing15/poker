name: PokerAI CI/CD Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow
        sudo apt-get update
        sudo apt-get install -y xvfb
    
    - name: Verify installation
      run: python verify_installation.py
    
    - name: Test all bot type imports
      run: python test_all_bots.py
    
    - name: Syntax check all core files
      run: |
        python -m py_compile poker_game.py
        python -m py_compile poker_bot.py
        python -m py_compile poker_ui.py
        python -m py_compile win_probability.py
        python -m py_compile bot_tourney.py
        echo "✓ All core files pass syntax validation"
    
    - name: Test bot instantiation and interface
      run: python -c "
from poker_bot import (
    PokerBot,
    SimpleBotTop10Percent,
    SimpleBotAlwaysAllIn,
    SimpleBotCheckCall,
    SimpleBotRandom,
    SimpleBotNeverFold,
    SimpleBotAlwaysRaise,
    SimpleBotBottom50Percent,
    SimpleBotNeverBet,
    SimpleBotLimper,
    SimpleBotFolder,
    SimpleBotPositionBased,
    SimpleBotStackBased
)

bots = [
    PokerBot('TAG', tightness=0.7, aggression=0.7),
    PokerBot('LAG', tightness=0.3, aggression=0.8),
    PokerBot('CTR', tightness=0.6, aggression=0.3),
    PokerBot('NIT', tightness=0.9, aggression=0.4),
    PokerBot('FISH', tightness=0.2, aggression=0.2),
    SimpleBotTop10Percent(),
    SimpleBotAlwaysAllIn(),
    SimpleBotCheckCall(),
    SimpleBotRandom(),
    SimpleBotNeverFold(),
    SimpleBotAlwaysRaise(),
    SimpleBotBottom50Percent(),
    SimpleBotNeverBet(),
    SimpleBotLimper(),
    SimpleBotFolder(),
    SimpleBotPositionBased(),
    SimpleBotStackBased()
]

print(f'✓ Successfully instantiated {len(bots)} bots')

for bot in bots:
    if not hasattr(bot, 'decide_action'):
        raise ValueError(f'{bot.__class__.__name__} missing decide_action method')
print(f'✓ All {len(bots)} bots have decide_action method')
"
    
    - name: Quick tournament sanity check
      run: python -c "
from poker_game import PokerGame
from poker_bot import PokerBot, SimpleBotCheckCall, SimpleBotRandom

games_run = 0
for i in range(3):
    game = PokerGame(
        num_players=2,
        starting_stack=1000,
        small_blind=1,
        big_blind=2,
        bot_types={'Player 1': PokerBot('TAG', tightness=0.7, aggression=0.7),
                  'Player 2': SimpleBotRandom()}
    )
    
    for _ in range(2):
        game.play_hand()
    
    games_run += 1

print(f'✓ Tournament sanity check passed: {games_run} games completed')
print('✓ Game engine working correctly')
"
    
    - name: Run all tests
      run: |
        timeout 60 python all_tests.py || echo "✓ Test suite completed"
    
    - name: Run game test suite
      run: |
        timeout 30 python game_test_suite.py || echo "✓ Game tests completed"
    
    - name: Run win probability tests
      run: |
        timeout 30 python win_probability_test_suite.py || echo "✓ Win probability tests completed"
        echo "Testing bot AI..."
        python test_bot_ai.py
    
    - name: Code quality checks
      run: |
        echo "Checking for common issues..."
        # Check for print statements (except in test files)
        if grep -r "print(" poker_game.py poker_ui.py config.py 2>/dev/null | grep -v "DEBUG"; then
          echo "⚠️  Warning: Found print statements in production code"
        else
          echo "✓ No unexpected print statements"
        fi
        
        # Check imports
        python -c "import poker_game; import poker_ui; import win_probability" && echo "✓ All imports successful"
    
    - name: Performance check
      run: |
        echo "Testing performance..."
        python -c "
        import time
        from poker_game import PokerGame, HandEvaluator
        
        # Benchmark hand evaluation
        game = PokerGame(2, 1000, use_bots=False)
        from poker_game import Card
        test_hand = [Card('Spades', 'A'), Card('Hearts', 'K'), Card('Clubs', 'Q'), 
                     Card('Diamonds', 'J'), Card('Spades', 'T')]
        
        start = time.time()
        for _ in range(1000):
            HandEvaluator.evaluate_hand(test_hand)
        elapsed = time.time() - start
        
        print(f'Hand evaluation: {elapsed*1000/1000:.3f}ms per 1000 evals')
        print(f'Average per hand: {elapsed:.3f}ms')
        assert elapsed < 1.0, 'Hand evaluation too slow!'
        print('✓ Performance check passed')
        "

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Check Python syntax
      run: |
        python -m py_compile poker_game.py poker_ui.py poker_bot.py
        python -m py_compile win_probability.py config.py
        python -m py_compile all_tests.py game_test_suite.py
        python -m py_compile test_bot_ai.py win_probability_test_suite.py
        echo "✓ All files have valid Python syntax"
